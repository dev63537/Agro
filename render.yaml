services:
  - type: web
    name: agro-billing-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: "npm ci"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: ./uploads
      - key: DEFAULT_GST_PERCENT
        value: "5"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
